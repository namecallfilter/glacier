<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Glacier Cast Receiver</title>
	<style>
		html,
		body,
		cast-media-player {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
		}
	</style>
</head>

<body>
	<cast-media-player></cast-media-player>

	<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
	<script>
		(() => {
			const MESSAGE_NAMESPACE = 'urn:x-cast:com.namecallfilter.glacier.cast';
			const STATUS_INTERVAL_MS = 1000;
			const TARGET_LATENCY_SECONDS = 3;
			const MAX_LATENCY_SECONDS = 8;

			const retryParameters = {
				maxAttempts: 4,
				baseDelay: 1000,
				backoffFactor: 1.5,
				fuzzFactor: 0.1,
			};

			const playbackConfig = new cast.framework.PlaybackConfig();
			playbackConfig.autoResumeNumberOfSegments = 0;
			playbackConfig.enableSmoothLiveRefresh = false;
			playbackConfig.segmentRequestRetryLimit = 2;
			playbackConfig.shakaConfig = {
				streaming: {
					lowLatencyMode: true,
					bufferingGoal: 4,
					rebufferingGoal: 1,
					bufferBehind: 6,
					updateIntervalSeconds: 0.5,
					segmentPrefetchLimit: 1,
					inaccurateManifestTolerance: 1,
					startAtSegmentBoundary: false,
					liveSync: {
						enabled: true,
						targetLatency: TARGET_LATENCY_SECONDS,
						targetLatencyTolerance: 1,
						maxPlaybackRate: 1.08,
						minPlaybackRate: 0.98,
						panicMode: true,
						panicThreshold: MAX_LATENCY_SECONDS,
						dynamicTargetLatency: {
							enabled: true,
							minLatency: TARGET_LATENCY_SECONDS,
							maxLatency: MAX_LATENCY_SECONDS,
							rebufferIncrement: 1,
							stabilityThreshold: 8,
							maxAttempts: 3,
						},
					},
					retryParameters,
				},
				manifest: {
					defaultPresentationDelay: TARGET_LATENCY_SECONDS,
					updatePeriod: 0.5,
					retryParameters,
					hls: {
						ignoreTextStreamFailures: true,
					},
				},
			};

			const context = cast.framework.CastReceiverContext.getInstance();
			const playerManager = context.getPlayerManager();

			const finiteNumber = (value) =>
				typeof value === 'number' && Number.isFinite(value);

			const mediaTimeForNow = () => {
				if (typeof playerManager.getMediaTimeForAbsoluteTime === 'function') {
					const mediaTime = playerManager.getMediaTimeForAbsoluteTime(Date.now() / 1000);
					if (finiteNumber(mediaTime)) {
						return {
							mediaTime,
							reference: 'absoluteLiveEdge',
						};
					}
				}

				if (typeof playerManager.getStartAbsoluteTime === 'function') {
					const startAbsoluteTime = playerManager.getStartAbsoluteTime();
					if (finiteNumber(startAbsoluteTime)) {
						return {
							mediaTime: Date.now() / 1000 - startAbsoluteTime,
							reference: 'startAbsoluteTime',
						};
					}
				}

				return null;
			};

			const liveStatus = () => {
				if (typeof playerManager.getLiveSeekableRange !== 'function') return null;
				if (typeof playerManager.getCurrentTimeSec !== 'function') return null;

				const range = playerManager.getLiveSeekableRange();
				const currentTime = playerManager.getCurrentTimeSec();

				if (!range || !finiteNumber(range.end) || !finiteNumber(currentTime)) return null;

				const seekableLatency = Math.max(0, range.end - currentTime);
				const liveNow = mediaTimeForNow();
				const latency = liveNow
					? Math.max(0, liveNow.mediaTime - currentTime)
					: seekableLatency;

				return {
					currentTime,
					rangeStart: finiteNumber(range.start) ? range.start : null,
					rangeEnd: range.end,
					latency,
					seekableLatency,
					latencyReference: liveNow
						? liveNow.reference
						: 'liveSeekableRange',
				};
			};

			const statusMessage = () => {
				const status = liveStatus();

				return {
					type: 'status',
					latencyMs: status ? Math.round(status.latency * 1000) : null,
					seekableLatencyMs: status ? Math.round(status.seekableLatency * 1000) : null,
					currentTimeSec: status ? status.currentTime : null,
					rangeStartSec: status ? status.rangeStart : null,
					rangeEndSec: status ? status.rangeEnd : null,
					targetLatencySec: TARGET_LATENCY_SECONDS,
					maxLatencySec: MAX_LATENCY_SECONDS,
					latencyReference: status ? status.latencyReference : null,
				};
			};

			const sendStatus = (senderId = null) => {
				const message = statusMessage();

				const send = (id) => {
					try {
						context.sendCustomMessage(MESSAGE_NAMESPACE, id, message);
					} catch (_) { }
				};

				if (senderId) {
					send(senderId);
					return message;
				}

				const senders = typeof context.getSenders === 'function'
					? context.getSenders()
					: [];

				for (const sender of senders) {
					if (sender && sender.id) send(sender.id);
				}

				return message;
			};

			playerManager.setMessageInterceptor(
				cast.framework.messages.MessageType.LOAD,
				(loadRequestData) => {
					const media = loadRequestData.media;

					if (media) {
						media.entity = media.entity || media.contentId;
						media.contentUrl = media.contentUrl || media.contentId;
						media.streamType = cast.framework.messages.StreamType.LIVE;
						media.contentType = media.contentType || 'application/x-mpegURL';
					}

					loadRequestData.autoplay = true;
					sendStatus();
					return loadRequestData;
				},
			);

			context.addCustomMessageListener(MESSAGE_NAMESPACE, (event) => {
				let message = event.data;

				if (typeof message === 'string') {
					try {
						message = JSON.parse(message);
					} catch (_) {
						return;
					}
				}

				if (message && message.type === 'getStatus') {
					sendStatus(event.senderId);
				}
			});

			setInterval(sendStatus, STATUS_INTERVAL_MS);

			const receiverOptions = new cast.framework.CastReceiverOptions();
			receiverOptions.disableIdleTimeout = true;
			receiverOptions.playbackConfig = playbackConfig;
			receiverOptions.statusText = 'Glacier';
			receiverOptions.useShakaForHls = true;

			context.start(receiverOptions);
		})();
	</script>
</body>

</html>
